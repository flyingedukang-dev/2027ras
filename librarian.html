<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>별이 AI 사서</title>
<style>:root{--ink:#1F3A36;--moss:#3E6B5E;--plum:#C9527A;--sky:#3D7EA6;--paper:#FBFAF7;--line:#E6E2DA;--warn:#B8432F;--star:#F2C14E}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--paper);color:var(--ink);max-width:820px;margin:0 auto;padding:16px}
header{border-bottom:2px solid var(--ink);padding-bottom:10px}h1{font-size:20px}.sub{font-size:13px;color:var(--moss)}
button{font:inherit;cursor:pointer}.btn{padding:8px 14px;border:none;border-radius:8px;background:var(--ink);color:#fff;font-weight:600}
.mini{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.grid{display:grid;gap:10px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:repeat(2,1fr)}
@media(max-width:640px){.g4,.g2{grid-template-columns:repeat(2,1fr)}}</style></head><body>
<header><h1>별이 AI 사서 ⭐</h1><div class="sub">우리 도서관 책 안에서 골라주는 AI 사서</div></header>
<div id="ai"></div>
<div class="card" style="border:2px solid var(--star)"><div id="say" style="font-size:16px">안녕! 나는 별이야. 오늘 어떤 책이 읽고 싶어?</div></div>
<div class="grid g4" id="moods" style="margin-top:10px"></div>
<div style="display:flex;gap:6px;margin-top:10px"><input id="q" style="flex:1" placeholder="글로 물어보기 (예: 웃긴 책)"><button class="btn" onclick="ask(document.getElementById('q').value)">묻기</button></div>
<div id="out" style="margin-top:10px"></div>
<script src="ras-config.js"></script>
<script src="ai-config.js"></script>
<script>
const MOODS=[["😆","웃긴 책"],["🗺️","모험"],["🐾","동물"],["🔬","과학"]];
document.getElementById("moods").innerHTML=MOODS.map(m=>`<button class="card" style="text-align:center;margin:0" onclick="ask('${m[1]}')"><div style="font-size:28px">${m[0]}</div><div style="font-size:13px">${m[1]}</div></button>`).join("");
const CAT=[["만복이네 떡집","김리리","동화 유머 가족"],["마당을 나온 암탉","황선미","동화 동물 용기"],["몸튼맘튼 축구왕","김혜정","스포츠 도전"],["안녕 나의 베트남","응우옌","다문화 가족"],["설민석의 한국사 대모험","설민석","역사 만화"],["정재승의 인간 탐구 보고서","정재승","과학 뇌 만화"]];
const SAMPLE={reply:"이런 책 어때? 우리 도서관에 있는 책들로 골라봤어!",books:[{t:"만복이네 떡집",a:"김리리",r:"먹으면 말버릇이 바뀌는 떡! 웃기고 따뜻해."},{t:"마당을 나온 암탉",a:"황선미",r:"용감한 암탉 잎싹이의 모험 이야기야."},{t:"몸튼맘튼 축구왕","a":"김혜정",r:"축구를 좋아하면 딱이야!"}]};
async function ask(q){
 if(!q)return;document.getElementById("say").textContent="우리 도서관 책장을 살펴보는 중…";document.getElementById("out").innerHTML="";
 const list=CAT.map((b,i)=>i+"|"+b[0]+"|"+b[1]+"|"+b[2]).join("\n");
 const prompt=`너는 초등 도서관 AI 사서 '별이'야. 아래 우리 도서관 책 목록(번호|제목|저자|주제) 안에서만 학생 요청 "${q}"에 맞는 3권을 골라 다정하게. 반드시 JSON만: {"reply":"인사 한 문장","books":[{"t":"제목","a":"저자","r":"추천 이유 한 문장"}]}\n${list}`;
 try{const raw=await AICONF.ask(prompt,700);show(JSON.parse(raw.replace(/```json|```/g,"").trim()));}
 catch(e){document.getElementById("say").textContent=e.message==="NO_KEY"?"(샘플) 이런 책 어때?":"(샘플) 잠깐 딴생각했어!";show(SAMPLE);}
}
function show(d){document.getElementById("say").textContent=d.reply;
 document.getElementById("out").innerHTML=d.books.map((b,i)=>`<div class="card" style="border-left:6px solid ${["#3E6B5E","#C9527A","#3D7EA6"][i%3]}"><b>${b.t}</b> <span style="font-size:12px;color:#777">${b.a}</span><div style="font-size:14px;margin-top:4px">${b.r}</div></div>`).join("");}
AICONF.banner(document.getElementById("ai"),"책 추천");
</script></body></html>
