<style>
:root{--ink:#1F3A36;--moss:#3E6B5E;--plum:#C9527A;--sky:#3D7EA6;--line:#E6E2DA;--warn:#B8432F;--star:#F2C14E}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:#F3EEE3;color:var(--ink);min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:baseline;padding:14px 24px 6px;flex-wrap:wrap;gap:8px}
h1{font-size:24px}h1 small{display:block;font-size:13px;font-weight:400;color:var(--moss)}
main{flex:1;display:grid;grid-template-columns:1fr 240px;gap:12px;padding:0 24px 16px}
.stage{position:relative;width:100%;aspect-ratio:1024/559;border-radius:14px;overflow:hidden;box-shadow:0 4px 20px rgba(31,58,54,.18)}
.stage img,.stage svg{position:absolute;inset:0;width:100%;height:100%}
aside{display:flex;flex-direction:column;gap:10px}
.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px}
.big{font-size:38px;font-weight:700}.msg{font-size:13px;color:#666;line-height:1.5}
.legend div{display:flex;align-items:center;gap:8px;font-size:13px}.legend i{width:12px;height:12px;border-radius:50%;display:inline-block}
@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}.bloom{transform-box:fill-box;transform-origin:center;animation:pop .5s ease-out both}
@media(max-width:820px){main{grid-template-columns:1fr}}

<script src="ras-config.js"></script>
<script>
async function _loadRoster(){
  try{
    if(!(window.RAS&&RAS.roster))return false;
    const r=await RAS.roster();
    if(r&&r.length){
      CLASSES=RAS.classesList(r);
      if(typeof DAKKUM!=="undefined") DAKKUM=RAS.dakkumList(r);
      return true;
    }
  }catch(e){}
  return false;
}
let CLASSES=["1-1","1-2","2-1","2-2","3-1","3-2","3-3","4-1","4-2","5-1","5-2","5-3","6-1"];
const TIPS=[[150,222],[205,150],[268,108],[335,72],[400,62],[470,45],[540,60],[615,50],[690,70],[765,100],[835,150],[890,215],[930,285]];
const STONES=CLASSES.map((c,i)=>[219+i*50.3,512]);const COL={R:"#3E6B5E",A:"#C9527A",S:"#3D7EA6"},BUD="#BDB6A8";
const svg=document.getElementById("ov");let CUR={},sel=null;
const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):0;
function num(v){ if(v==null) return 0; if(typeof v==="number") return v; var n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; }
function _ymd(d){
  if(d==null) return "";
  if(typeof d==="string"){
    var m=d.match(/(\d{4})[-.\/]\s*(\d{1,2})[-.\/]\s*(\d{1,2})/);
    if(m) return m[1]+"-"+String(m[2]).padStart(2,"0")+"-"+String(m[3]).padStart(2,"0");
    var dt=new Date(d); if(!isNaN(dt)) return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
    return "";
  }
  var dt=new Date(d);
  return dt.getFullYear()+"-"+String(dt.getMonth()+1).padStart(2,"0")+"-"+String(dt.getDate()).padStart(2,"0");
}
function weekKey(d){
  var s=_ymd(d); if(!s) return "";
  var p=s.split("-"); var dt=new Date(Date.UTC(+p[0],+p[1]-1,+p[2]));
  var day=(dt.getUTCDay()+6)%7;
  dt.setUTCDate(dt.getUTCDate()-day);
  return dt.toISOString().slice(0,10);
}
function petal(cx,cy,r,f){let s="";for(let k=0;k<5;k++){const a=k*72*Math.PI/180;s+=`<circle cx="${(cx+Math.cos(a)*r*.9).toFixed(1)}" cy="${(cy+Math.sin(a)*r*.9).toFixed(1)}" r="${r}" fill="${f}"/>`;}return s+`<circle cx="${cx}" cy="${cy}" r="${r*.55}" fill="#F7E07A"/>`;}
async function load(){
  let rows; try{rows=await RAS.read("daily");}catch(e){return;}
  const byWeek={};rows.forEach(r=>{if(!r["날짜"])return;const w=weekKey(r["날짜"]);(byWeek[w]=byWeek[w]||[]).push(r);});
  const weeks=Object.keys(byWeek).sort();
  if(!weeks.length){document.getElementById("total").textContent="—";document.getElementById("tm").textContent="아직 입력이 없어요";return;}
  const latest=byWeek[weeks[weeks.length-1]];const m={};
  latest.forEach(r=>{const t=num(r["정원"])||1;const c=String(r["학급"]).trim();if(!m[c])m[c]={R:[],A:[],S:[]};m[c].R.push(num(r["R"])/t*100);m[c].A.push(num(r["A"])/t*100);m[c].S.push(num(r["S"])/t*100);});
  CUR={};CLASSES.forEach(c=>{const x=m[c];CUR[c]=x?{R:avg(x.R),A:avg(x.A),S:avg(x.S)}:{R:0,A:0,S:0};});
  draw();
}
function draw(){
  let bloom=0,s="";
  CLASSES.forEach((c,i)=>{const [x,y]=TIPS[i];const d=CUR[c]||{R:0,A:0,S:0};const dim=sel!==null&&sel!==i?.35:1;s+=`<g opacity="${dim}">`;
    const slots=[[-20,-4],[-6,-16],[10,-18],[24,-4],[4,8],[-10,10]];
    ["R","R","A","A","S","S"].forEach((k,j)=>{const th=j%2?85:60,[dx,dy]=slots[j],cx=x+dx,cy=y+dy;if(d[k]>=th){bloom++;s+=`<g class="bloom" style="animation-delay:${i*60+j*40}ms">${petal(cx,cy,5.5,COL[k])}</g>`;}else s+=`<ellipse cx="${cx}" cy="${cy}" rx="4" ry="5.5" fill="${BUD}" stroke="#8C8478" stroke-width=".8"/>`;});
    s+=`</g>`;const [sx,sy]=STONES[i];
    s+=`<g data-i="${i}" style="cursor:pointer"><ellipse cx="${sx}" cy="${sy}" rx="22" ry="14" fill="${sel===i?'rgba(201,82,122,.35)':'rgba(0,0,0,0)'}" stroke="${sel===i?'#C9527A':'none'}" stroke-width="2"/><text x="${sx}" y="${sy+34}" font-size="11" text-anchor="middle" fill="#1F3A36" font-weight="600" stroke="#F3EEE3" stroke-width="3" paint-order="stroke">${c}</text></g>`;});
  svg.innerHTML=s;document.getElementById("total").textContent=Math.round(bloom/78*100)+"%";document.getElementById("tm").textContent=`꽃 78송이 중 ${bloom}송이`;
  svg.querySelectorAll("g[data-i]").forEach(g=>g.onclick=()=>{sel=sel===+g.dataset.i?null:+g.dataset.i;draw();info();});
}
function info(){const el=document.getElementById("info");if(sel===null){el.innerHTML='<h3>돌을 눌러 보세요</h3><div class="msg">돌 하나가 한 학급입니다.</div>';return;}
  const c=CLASSES[sel],d=CUR[c]||{R:0,A:0,S:0},low=["R","A","S"].filter(k=>d[k]>0&&d[k]<70),nm={R:"독서",A:"예술",S:"스포츠"};
  el.innerHTML=`<h3>${c} 가지</h3><div class="msg">R ${d.R}% · A ${d.A}% · S ${d.S}%<br>${low.length?`<b style="color:#B8432F">${low.map(k=>nm[k]).join(", ")}</b> 봉오리예요.`:"여섯 송이 활짝!"}</div>`;}
const conn=document.getElementById("conn");RAS.banner(conn);conn._onReady=function(){ _loadRoster().then(load); };if(RAS.conf().url){ _loadRoster().then(load); }
</script><script>if(window.ROLES)ROLES.badge();</script>
