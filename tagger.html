<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>장서 태깅 도우미</title>
<style>:root{--ink:#1F3A36;--moss:#3E6B5E;--plum:#C9527A;--sky:#3D7EA6;--paper:#FBFAF7;--line:#E6E2DA;--warn:#B8432F;--star:#F2C14E}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--paper);color:var(--ink);max-width:820px;margin:0 auto;padding:16px}
header{border-bottom:2px solid var(--ink);padding-bottom:10px}h1{font-size:20px}.sub{font-size:13px;color:var(--moss)}
button{font:inherit;cursor:pointer}.btn{padding:8px 14px;border:none;border-radius:8px;background:var(--ink);color:#fff;font-weight:600}
.mini{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:13px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin-top:10px}
.grid{display:grid;gap:10px}.g3{grid-template-columns:repeat(3,1fr)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center}th{background:#EEF2F0}
@media(max-width:640px){.g3{grid-template-columns:1fr}}</style><script src="roles.js"></script>
<script>if(window.ROLES && !ROLES.guard()){throw new Error("redirect");}</script>
</head><body>
<header><h1>장서 태깅 도우미</h1><div class="sub">책 목록에 대상학년·주제어를 AI로 채우기</div></header>
<div id="ai"></div>
<div class="card"><div class="sub">한 줄에: 제목,저자,분류 (샘플이 들어 있어요)</div>
 <textarea id="in" rows="6" style="width:100%;margin-top:6px;font-family:monospace;font-size:13px">수상한 아파트,박현숙,813.8
푸른 사자 와니니,이현,813.8
플랑크톤의 비밀,김종문,470
긴긴밤,루리,813.8
설민석의 한국사 대모험,설민석,911
정재승의 인간 탐구 보고서,정재승,400</textarea>
 <button class="btn" style="margin-top:8px" onclick="run()">AI 태깅</button></div>
<div id="out"></div>
<script src="ras-config.js"></script>
<script src="ai-config.js"></script>
<script>
const SAMPLE=[["3~4학년","동화 미스터리 아파트 유머"],["3~4학년","동화 동물 사자 성장"],["3~4학년","과학 바다 플랑크톤 생태"],["5~6학년","동화 동물 우정 감동"],["5~6학년","역사 한국사 만화 모험"],["5~6학년","과학 뇌 인간 만화"]];
async function run(){
 const rows=document.getElementById("in").value.trim().split("\n").map(l=>l.split(","));
 document.getElementById("out").innerHTML='<p class="sub" style="margin-top:10px">태깅 중…</p>';
 const list=rows.map((r,i)=>i+"|"+(r[0]||"")+"|"+(r[1]||"")+"|"+(r[2]||"")).join("\n");
 const prompt=`너는 초등 사서. 책 목록(번호|제목|저자|KDC)에 대상학년("1~2학년"/"3~4학년"/"5~6학년" 중)과 주제어(한국어 4~6개 띄어쓰기)를 붙여. JSON 배열만: [{"i":0,"grade":"3~4학년","kw":"동화 친구 학교"}]\n${list}`;
 try{const raw=await AICONF.ask(prompt,1000);show(rows,JSON.parse(raw.replace(/```json|```/g,"").trim()));}
 catch(e){show(rows,rows.map((r,i)=>({i,grade:SAMPLE[i]?SAMPLE[i][0]:"3~4학년",kw:SAMPLE[i]?SAMPLE[i][1]:"동화"})),e.message);}
}
function show(rows,out,err){
 document.getElementById("out").innerHTML=(err?`<div class="sub" style="color:#8a6d00;margin-top:8px">${err==="NO_KEY"?"AI 키 없음 — 샘플 태깅":"AI 실패 — 샘플"}</div>`:"")+
  `<div class="card"><table><tr><th>제목</th><th>저자</th><th>대상학년</th><th>주제어</th></tr>`+
  rows.map((r,i)=>{const o=out.find(x=>x.i===i)||{};return `<tr><td style="text-align:left">${r[0]||""}</td><td>${r[1]||""}</td><td>${o.grade||""}</td><td style="text-align:left">${o.kw||""}</td></tr>`;}).join("")+`</table></div>`;
}
AICONF.banner(document.getElementById("ai"),"장서 태깅");
</script><script>if(window.ROLES)ROLES.badge();</script>
</body></html>
