<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>매화 RAS-D · 들어가기</title>
<style>
:root{--ink:#1F3A36;--moss:#3E6B5E;--plum:#C9527A;--sky:#3D7EA6;--paper:#FBFAF7;--line:#E6E2DA;--warn:#B8432F;--star:#F2C14E}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--paper);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.box{max-width:440px;width:100%;background:#fff;border:1px solid var(--line);border-radius:16px;padding:24px}
h1{font-size:22px;text-align:center}.sub{font-size:13px;color:var(--moss);text-align:center;margin-top:4px;margin-bottom:18px}
.roles{display:grid;gap:10px}
.role{border:2px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;text-align:left;background:#fff;color:var(--ink)}
.role:hover{border-color:var(--ink)}
.role.on{border-color:var(--plum);background:#FDF0F5}
.role b{font-size:16px;color:var(--ink)}.role.on b{color:var(--plum)}.role span{font-size:12px;color:#777;display:block;margin-top:2px}
input{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:12px}
button{width:100%;font:inherit;cursor:pointer;border:none;border-radius:10px;padding:12px;background:var(--ink);color:#fff;font-weight:700;margin-top:12px}
.msg{color:var(--warn);font-size:13px;margin-top:8px;text-align:center}
.note{font-size:11px;color:#999;margin-top:14px;text-align:center;line-height:1.5}
</style></head><body>
<div class="box">
  <h1>매화 RAS-D</h1>
  <div class="sub">누구로 들어가시나요?</div>
  <div class="roles">
    <button class="role on" data-r="student"><b>학생</b><span>참여예산·게시판·경영회의·별이 사서 — 암호 없이</span></button>
    <button class="role" data-r="teacher"><b>담임 선생님</b><span>담임 입력·주간 편지 — 담임 암호 필요</span></button>
    <button class="role" data-r="admin"><b>교장·관리자</b><span>대시보드·결정 일지·매화나무 — 관리자 암호 필요</span></button>
    <button class="role" data-r="parent"><b>학부모</b><span>학교 소식·주간 편지·설문·서포터즈 — 학부모 암호 필요</span></button>
  </div>
  <div id="pwwrap" style="display:none"><input id="pw" type="password" placeholder="암호를 입력하세요"></div>
  <button id="go">들어가기</button>
  <div class="msg" id="msg"></div>
  <div class="note">암호는 학교에서 정합니다. 이 잠금은 실수로 다른 화면에 들어가는 것을 막는 가벼운 잠금이며, 진짜 로그인 보안은 아닙니다.</div>
</div>
<script src="roles.js"></script>
<script>
let role="student";
const params=new URLSearchParams(location.search);
const to=params.get("to")||"index.html";
document.querySelectorAll(".role").forEach(b=>b.onclick=()=>{
  role=b.dataset.r;
  document.querySelectorAll(".role").forEach(x=>x.classList.remove("on"));
  b.classList.add("on");
  document.getElementById("pwwrap").style.display = role==="student"?"none":"block";
  document.getElementById("msg").textContent="";
});
document.getElementById("go").onclick=()=>{
  const pw=document.getElementById("pw").value;
  if(ROLES.login(role,pw)){
    const params2=new URLSearchParams(location.search);
    const dest=params2.get("to");
    location.href = dest ? dest : "home.html";   // 목적지 있으면 거기로, 없으면 역할별 홈
  } else {
    document.getElementById("msg").textContent="암호가 맞지 않습니다.";
  }
};
document.getElementById("pw")&&document.getElementById("pw").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("go").click();});
</script></body></html>
