<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>교장의 결정 일지 — 실데이터</title>
<style>
:root{--ink:#1F3A36;--moss:#3E6B5E;--plum:#C9527A;--sky:#3D7EA6;--paper:#FBFAF7;--line:#E6E2DA;--warn:#B8432F;--star:#F2C14E}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Noto Sans KR','Apple SD Gothic Neo',sans-serif;background:var(--paper);color:var(--ink);max-width:680px;margin:0 auto;padding:16px}
header{border-bottom:2px solid var(--ink);padding-bottom:10px;display:flex;justify-content:space-between;align-items:end;flex-wrap:wrap;gap:8px}
h1{font-size:20px}.sub{font-size:13px;color:var(--moss)}
.tabs{display:flex;gap:6px}.tabs button{padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font:inherit;font-size:12px;cursor:pointer}.tabs button.on{background:var(--ink);color:#fff}
.stat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}.stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;text-align:center}.stat .n{font-size:20px;font-weight:700}.stat .l{font-size:11px;color:#777}
.form{background:#fff;border:2px solid var(--star);border-radius:12px;padding:12px;margin-top:12px}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px;width:100%;margin-top:6px}
button{font:inherit;cursor:pointer}.btn{padding:8px 14px;border:none;border-radius:8px;background:var(--ink);color:#fff;font-weight:600}
.chip{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;cursor:pointer}.chip.on{background:var(--ink);color:#fff}
.item{background:#fff;border-radius:12px;padding:12px;margin-top:10px;border-left:6px solid var(--line)}
.badge{font-size:12px;padding:2px 8px;border-radius:999px;font-weight:600}
</style><script src="roles.js"></script>
<script>if(window.ROLES && !ROLES.guard()){throw new Error("redirect");}</script>
</head><body>
<header><div><h1>교장의 결정 일지</h1><div class="sub">AI·데이터가 제안한 것, 학교가 결정한 것, 그 이유</div></div>
<div class="tabs"><button class="on" data-v="public" onclick="setView('public')">공개</button><button data-v="admin" onclick="setView('admin')">교장</button></div></header>
<div id="conn" style="margin-top:10px"></div>
<div id="app"></div>
<script src="ras-config.js"></script>
<script>
const ST={채택:["#EEF4F1","#3E6B5E"],보류:["#FFF6D6","#A67C00"],기각:["#E6E2DA","#666"]};
let view="public", rows=[];
function setView(v){view=v;document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));render();}
async function load(){try{rows=await RAS.read("feedback");render();}catch(e){}}
function render(){
  const dec=rows.filter(r=>r["결정"]);
  const ai=dec.filter(r=>r["출처"]==="AI 제안");
  const adopted=ai.filter(r=>r["결정"]==="채택");
  const rate=ai.length?Math.round(adopted.length/ai.length*100):0;
  const improved=adopted.filter(r=>r["결과"]&&!String(r["결과"]).includes("관찰")&&r["결과"]!=="-").length;
  const withReason=dec.filter(r=>r["이유"]).length;
  document.getElementById("app").innerHTML=`
   <div class="stat"><div><div class="l">결정</div><div class="n">${dec.length}</div></div><div><div class="l">AI 채택률</div><div class="n">${rate}%</div></div><div><div class="l">채택 후 개선</div><div class="n">${improved}</div></div><div><div class="l">이유 기록</div><div class="n">${withReason}/${dec.length}</div></div></div>
   <p style="font-size:12px;background:#FFF6D6;padding:8px;border-radius:8px;margin-top:8px">AI 제안을 모두 채택하는 것이 목표가 아닙니다. 기각·보류의 이유가 남는 것이 이 일지의 목적입니다.</p>
   ${view==="admin"?formHtml():""}
   <div id="list"></div>`;
  const list=document.getElementById("list");
  list.innerHTML=[...dec].reverse().map((r,i)=>{const d=r["결정"];return `<div class="item" style="border-left-color:${ST[d]?ST[d][1]:'#ccc'}">
    <div style="display:flex;justify-content:space-between;font-size:12px;color:#777"><span>${r["시각"]||""} · ${r["출처"]||""}</span><span class="badge" style="background:${ST[d]?ST[d][0]:'#eee'};color:${ST[d]?ST[d][1]:'#333'}">${d}</span></div>
    <div style="font-size:14px;margin-top:6px"><b style="color:#B8432F">발견</b> ${r["발견"]||""}<br><b style="color:#3D7EA6">제안</b> ${r["조치"]||""}</div>
    <div style="font-size:14px;background:#FBFAF7;padding:8px;border-radius:6px;margin-top:6px"><b>교장의 이유</b> ${r["이유"]||"<span style='color:#B8432F'>(이유가 비어 있습니다)</span>"}</div>
    ${r["결과"]&&r["결과"]!=="-"?`<div style="font-size:14px;margin-top:4px"><b style="color:#3E6B5E">결과</b> ${r["결과"]}</div>`:""}</div>`;}).join("")||'<div class="sub" style="margin-top:14px">아직 기록이 없어요. 대시보드의 AI 보좌관에서 채택·기각하면 여기에 쌓입니다.</div>';
  if(view==="admin")bindForm();
}
function formHtml(){return `<div class="form"><b style="font-size:14px">결정 기록하기</b>
  <div style="display:flex;gap:4px;margin-top:6px" id="src">${["AI 제안","학부모 설문","학생자치회","교사 협의"].map((s,i)=>`<button class="chip ${i===0?"on":""}" data-s="${s}">${s}</button>`).join("")}</div>
  <input id="find" placeholder="무엇을 발견했나 (수치 포함)"><input id="act" placeholder="제안된 조치">
  <div style="display:flex;gap:4px;margin-top:6px" id="dec">${["채택","보류","기각"].map((s,i)=>`<button class="chip ${i===0?"on":""}" data-d="${s}" style="flex:1">${s}</button>`).join("")}</div>
  <textarea id="reason" rows="2" placeholder="이유 — 학부모와 학생이 읽는다고 생각하고 (필수)"></textarea>
  <button class="btn" id="submit" style="margin-top:6px;width:100%">일지에 올리기</button></div>`;}
function bindForm(){let src="AI 제안",dec="채택";
  document.querySelectorAll("#src .chip").forEach(b=>b.onclick=()=>{src=b.dataset.s;document.querySelectorAll("#src .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  document.querySelectorAll("#dec .chip").forEach(b=>b.onclick=()=>{dec=b.dataset.d;document.querySelectorAll("#dec .chip").forEach(x=>x.classList.remove("on"));b.classList.add("on");});
  document.getElementById("submit").onclick=async()=>{
    const find=document.getElementById("find").value,act=document.getElementById("act").value,reason=document.getElementById("reason").value;
    if(!find||!act||!reason){alert("발견·조치·이유를 모두 채워 주세요");return;}
    document.getElementById("submit").textContent="올리는 중…";
    await RAS.write("feedback","append",{"시각":new Date().toLocaleString("ko-KR"),"출처":src,"발견":find,"조치":act,"결정":dec,"이유":reason,"결과":dec==="채택"?"관찰 중":"-"});
    load();
  };
}
const conn=document.getElementById("conn");RAS.banner(conn);conn._onReady=load;if(RAS.conf().url)load();
</script><script>if(window.ROLES)ROLES.badge();</script>
</body></html>
